agent_id: sca-remediation
title: SCA Remediation Evidence Contract
summary: Use namespace-scoped project, Finding, and VersionUpgrade evidence before recommending or preparing any remediation
  branch.
task_profiles:
  - id: resolve-scope
    compact: true
    output_fields:
      - summary
      - project_resolution
      - execution_context
      - evidence_queries
      - data_gaps
      - policy_context
      - policy_evaluations
    included_sections:
      - scope-resolution
    title: Resolve Scope
    summary: Prove namespace, repository, and Endor project identity only.
    when_to_use:
      - The user asks whether the repository is known to Endor or which project/namespace applies.
      - The next workflow step depends on scoped Endor evidence.
    minimal_evidence:
      - Current repository root and remote or user-provided repository identity.
      - Namespace provenance and one Project lookup or a precise project lookup data_gaps entry.
      - Branch provenance field and `project_resolution.traverse_attempted`.
    stop_when:
      - '`project_resolution.status`, namespace provenance, branch provenance, `project_resolution.traverse_attempted`, and attempted selectors are known.'
      - Do not query Finding or VersionUpgrade evidence in this profile unless scope is already resolved and the user asks
        for it.
    output_focus:
      - Return `project_resolution`, `evidence_queries`, and `data_gaps` with other required fields empty or null.
      - Include branch provenance and `project_resolution.traverse_attempted`.
  - id: evidence-check
    compact: true
    output_fields:
      - summary
      - project_resolution
      - execution_context
      - evidence_queries
      - data_gaps
      - policy_context
      - policy_evaluations
    included_sections:
      - scope-resolution
    title: Evidence Check
    summary: Prove whether scoped Finding and VersionUpgrade/UIA evidence exists without choosing a remediation.
    when_to_use:
      - The user asks what evidence is available, why a recommendation is blocked, or whether findings/UIA can be queried.
      - A read-only host check needs evidence discipline without a full plan.
    minimal_evidence:
      - Resolved project and namespace.
      - One main-context Finding query and one VersionUpgrade/UIA query, or precise data_gaps for each missing lane.
    stop_when:
      - Finding and VersionUpgrade/UIA availability is known for the resolved project.
      - Do not inspect source files or prepare branch names unless selection is requested.
    output_focus:
      - Return `evidence_queries`, high-level evidence counts, and `data_gaps`; leave selected remediation null when no selection
        was requested.
  - id: selection-plan
    compact: true
    output_fields:
      - summary
      - project_resolution
      - execution_context
      - evidence_queries
      - selected_remediation
      - uia_evidence
      - risk_decision
      - change_requests
      - data_gaps
      - policy_context
      - policy_evaluations
    included_sections:
      - scope-resolution
      - selection-planning
    title: Selection Plan
    summary: Select at most one UIA-backed remediation candidate and stop before mutation.
    when_to_use:
      - The user asks for the best next remediation, a PR plan, or a read-only remediation gate.
      - A read-only remediation gate needs a complete remediation gate JSON object.
    minimal_evidence:
      - Resolved project and VersionUpgrade/UIA evidence for candidate ranking and fixed-finding provenance.
      - Local manifest/source usage for the selected package when `execution_context.mode` is `local_checkout`; otherwise an explicit evidence-only risk fallback and source data gap.
      - Resolved project evidence includes branch provenance and `project_resolution.traverse_attempted`.
      - Use VersionUpgrade `vuln_finding_info` directly when it supplies the requested fixed-finding identifiers and counts. Otherwise add one exact batched Finding lookup by those current-run UUIDs, or a precise `data_gaps[]` entry.
      - Dirty worktree state for affected manifests before proposing any local mutation. This is not required for an evidence-only plan.
    stop_when:
      - One candidate is selected, blocked, or rejected with `risk_decision.status`.
      - Do not edit files, run dependency-manager mutations, create branches, or open change requests without explicit approval.
    output_focus:
      - Return exactly one JSON object with selected remediation, UIA evidence, risk decision, validation requirements, change
        request plan, and precise `data_gaps`.
      - Return `execution_context`; evidence-only continues Endor selection but cannot use `approved_low_risk` or create a change request.
      - Do not draft a full PR/MR body unless the current request explicitly asks for a PR/MR plan or body.
      - Return exactly one `change_requests` entry. It must contain a complete deterministic `inventory` even when source-provider lookup is unavailable.
      - 'For an unavailable lookup, use `status: unavailable`, identify the attempted or unavailable lookup method and check time, preserve the full key from the selected remediation, use an empty candidates array, and explain reconciliation and the blocker in `data_gaps`.'
      - Include branch provenance and `project_resolution.traverse_attempted`.
      - When a remediation candidate is selected, include `selected_remediation.branch_name` and
        `change_requests[].proposed_branch` using `remediation/sca/<package>-<target-version>`.
      - Set `risk_decision.status` to exactly one of `approved_low_risk`, `approved_with_validation_required`,
        `blocked_needs_compatibility_analysis`, or `rejected`; never use selection labels such as `selected`.
      - 'The selection-plan projection is authoritative: return only summary, project_resolution, execution_context, evidence_queries, selected_remediation, uia_evidence, risk_decision, change_requests, data_gaps, policy_context, and policy_evaluations. Omit remediation_candidates, patch_plan, validation, and tickets; put unrun checks in risk_decision.validation_requirements as strings.'
      - 'The generated selection-plan profile contract is strict: follow the canonical nested-key contract in the source instructions, use null for unknown scalar/object values and [] for unavailable arrays, and emit no aliases or extra keys.'
      - Mirror `finding_instances_fixed`, `unique_advisories_fixed`, and the verbatim 24-hex `fixed_finding_uuids` in both `selected_remediation` and `uia_evidence[0]`.
      - For an exact duplicate use `inventory.reconciliation.status: reuse_existing` or `blocked_duplicate` exactly.
      - Keep only package/manifest-overlapping inventory candidates. Each candidate has exactly author, author_type, branch, state, files, url, current_version, target_version, and exact_duplicate; do not emit number, versions, or overlap aliases.
      - Prove compact candidate overlap with at least one files path exactly matching selected_remediation.manifests or selected_remediation.affected_manifests; omit unrelated provider rows.
      - Use null versions only for a non-exact overlapping candidate when the provider evidence cannot determine them. Exact duplicates require both versions matching the selected remediation.
      - Prefer one bounded source-provider change-request list with changed-file paths, filter locally by selected manifest, then fetch only the matching manifest patch for at most five candidates. Avoid full bodies, comments, commits, reviews, and broad MCP/app inventory.
      - Before returning, verify that the projection is one syntactically complete JSON object with balanced object and array delimiters.
resources:
  - name: Project
    purpose: Resolve the repository-scoped project UUID, selected namespace, and parent namespace traversal evidence.
    fields:
      - uuid
      - meta.name
      - meta.parent_uuid
      - spec.git
  - name: Finding
    purpose: Query only main-context vulnerability findings by default and preserve finding UUID, target package, advisory,
      severity, and dependency file paths.
    fields:
      - uuid
      - context.type
      - spec.project_uuid
      - spec.finding_categories
      - spec.target_uuid
      - spec.dependency_file_paths
  - name: VersionUpgrade
    purpose: Verify UIA/CIA upgrade evidence before making low-risk or compatibility claims.
    fields:
      - uuid
      - meta.parent_uuid
      - spec.upgrade_info
      - spec.finding_fixing_upgrades
retrieval_steps:
  - Inspect supplied context manifests or local `.endorlabs-context` snapshots first and verify their namespace, project UUID,
    and freshness.
  - Resolve project identity before Finding or VersionUpgrade lookups; never ask the user for a project UUID as the default
    path.
  - For selection plans, query VersionUpgrade/UIA candidate summaries before detailed Finding expansion.
  - Query narrow main-context Finding availability for evidence checks. For selection plans, consume VersionUpgrade fixed-finding evidence first and issue at most one exact UUID-batched Finding read only for advisory mapping, explicit PR body detail, or count reconciliation that the UIA detail cannot support.
fallbacks:
  - If the first project lookup misses, retry the same namespace-scoped lookup with traversal before declaring a project gap.
  - If UIA/CIA evidence is unavailable, keep the candidate plan-only or require compatibility validation instead of calling
    it low risk.
  - Missing checkout -> continue Endor reads in `evidence_only`, no source/diff/validation/PR, and record `source_checkout_unavailable`. Missing provider write keeps an otherwise local plan not-created with `source_provider_write_unavailable`.
  - A read-only evidence gate or plan-only gate is not complete unless the final answer includes one parseable JSON object with `project_resolution`,
    `execution_context`, `selected_remediation`, `uia_evidence`, `risk_decision`, and `data_gaps`.
  - >-
    A resolved `project_resolution` needs branch provenance and `project_resolution.traverse_attempted`;
    if branch evidence is unavailable, set `project_resolution.branch_provenance` to `branch unknown: <reason>`
    and mirror the blocker in `data_gaps`.
  - Even when mutation is not approved, include `selected_remediation.branch_name`, `risk_decision.source_usage_summary`,
    `risk_decision.validation_requirements`, and `change_requests[].proposed_branch` when a remediation candidate is selected.
  - Always ledger the VersionUpgrade/UIA reads. Add a separate `Finding` row only when the selected task actually issued the conditional Finding batch; if that required read is unavailable, add a precise top-level `data_gaps[]` entry. VersionUpgrade `vuln_finding_info` is valid selected-candidate finding provenance without another API call.
data_gaps:
  - Record missing credentials, namespace conflicts, project lookup failures, absent main-context findings, missing VersionUpgrade
    evidence, and unavailable source files in `data_gaps`.
  - Preserve `namespace_provenance`, project query attempts, and context scope in the final gate output.
  - Preserve branch provenance and `project_resolution.traverse_attempted`; mirror missing branch evidence in `data_gaps`.
  - Render `uia_evidence` as an array of VersionUpgrade/UIA records, not as a single object.
  - For elevated, indeterminate, conflicting, or introduced-finding candidates, include `risk_decision.source_usage_summary`
    and validation requirements instead of returning a prose-only risk summary.
evidence_query_plans:
  - profile_id: resolve-scope
    title: Resolve Scope Query Plan
    objective: Prove namespace and project identity only; do not fetch vulnerability or upgrade inventories.
    query_order:
      - Read current repository root, branch, remote URL, and user-provided selectors.
      - Resolve namespace from the current request before environment or default config key extraction.
      - Query Project by repository full name or git selector with a tight field mask, retrying traversal only for the same
        proven namespace.
    avoid:
      - Do not query Finding, VersionUpgrade, PackageVersion, or dependency resources unless scope is already supplied and
        requested.
      - Do not ask for a project UUID as the default path or reuse one from memory.
    stop_after:
      - Stop when project_resolution.status, namespace_provenance, branch provenance, and project_resolution.traverse_attempted are known or data_gaps explains the blocker.
    data_gaps:
      - Record missing namespace, ambiguous repository selectors, project lookup failures, traversal misses, and host-blocked
        Endor access in data_gaps.
  - profile_id: evidence-check
    title: Evidence Availability Query Plan
    objective: Prove whether scoped Finding and VersionUpgrade/UIA evidence exists without selecting a remediation.
    query_order:
      - Resolve namespace and project first.
      - After project resolution, run the package-by-severity Finding aggregation and worthwhile VersionUpgrade count concurrently.
      - Preserve every returned package/severity group and both result counts in the evidence ledger.
    avoid:
      - Do not inspect local source files, fetch every finding body, or prepare branch names.
      - Do not turn local README or dependency files into Endor finding counts.
    stop_after:
      - Stop after availability and counts are known or blocked, before exploited-finding prioritization, Finding bodies, source inspection, or candidate selection.
    data_gaps:
      - Record unavailable Finding or VersionUpgrade/UIA lanes, stale context scope, and any missing namespace or project
        evidence in data_gaps.
  - profile_id: selection-plan
    title: Selection Plan Query Plan
    objective: Select at most one UIA-backed candidate by narrowing through VersionUpgrade before detailed Finding expansion.
    query_order:
      - Resolve namespace, project, repository provenance, and dirty worktree state first.
      - Query VersionUpgrade/UIA candidate summaries with tight fields for worth_it, is_best, upgrade risk, findings fixed,
        findings introduced, CIA status, direct package, and manifest files.
      - Fetch detailed VersionUpgrade/UIA evidence only for the selected candidate.
      - Inspect only the selected package manifests and source usage needed for risk_decision.source_usage_summary.
      - Consume `vuln_finding_info.fixed_findings` and nested fixed-summary UUIDs from that detail first. If they cannot support a requested advisory mapping, PR body detail, or count reconciliation, fetch all current-run UUIDs in one exact batched Finding query.
    avoid:
      - Do not enumerate broad Finding inventories before VersionUpgrade narrowing.
      - Do not fetch full advisory/finding lists when the current gate is only selecting or blocking one candidate.
      - Do not try bare package-name Finding filters, one Finding call per UUID, schema/describe probes, or unfiltered samples.
      - Do not edit files, create branches, run dependency-manager mutations, or open change requests without approval.
    stop_after:
      - Stop after one candidate is selected, blocked, or rejected with risk_decision.status and validation requirements.
    data_gaps:
      - Record skipped broad Finding detail, missing introduced-finding identity, missing advisory mapping, dirty worktree
        blockers, and unavailable UIA/CIA evidence in data_gaps.
evidence_query_recipes:
  - profile_id: resolve-scope
    id: local-git-state
    canonical_id: local-git-state
    resource: local-git
    purpose: Capture local repository provenance without reading secrets.
    template: pwd; git status --short --branch; git rev-parse HEAD; git config --get remote.origin.url
    fields:
      - cwd
      - branch
      - commit
      - remote.origin.url
      - dirty_files
    constraints:
      - Use as local context only; it does not prove Endor project, namespace, or finding counts.
  - id: project-by-git
    canonical_id: project-by-git
    resource: Project
    purpose: Resolve the current repository to a namespace-scoped Endor project with only identity fields.
    template: endorctl agent api --agent-id <agent-id> list -r Project -n <namespace> --filter 'spec.git.full_name=="<owner/repo>"' --page-size 2 --field-mask "uuid,meta.name,meta.parent_uuid,spec.git" -o json
    fields:
      - uuid
      - meta.name
      - meta.parent_uuid
      - spec.git
    constraints:
      - Use the namespace selected by the preflight.
      - Retry with --traverse only for the same proven namespace before reporting data_gaps.
    profile_id: resolve-scope
  - profile_id: evidence-check
    id: finding-package-severity-groups
    canonical_id: sca-finding-package-severity-groups
    resource: Finding
    purpose: Count main-context vulnerability findings by target package and severity without fetching finding rows.
    template: endorctl agent api --agent-id <agent-id> list -r Finding -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>"
      and spec.finding_categories contains FINDING_CATEGORY_VULNERABILITY and spec.dismiss==false' --group-aggregation-paths spec.target_dependency_package_name,spec.level
      -o json
    fields:
      - group_response.groups
      - aggregation_count.count
      - spec.target_dependency_package_name
      - spec.level
    constraints:
      - Use only after resolving one project UUID and explicit namespace provenance.
      - Preserve composite package/severity keys and counts; record missing dimensions in data_gaps.
  - profile_id: evidence-check
    id: version-upgrade-count
    canonical_id: version-upgrade-count
    resource: VersionUpgrade
    purpose: Count worthwhile main-context VersionUpgrade records without fetching candidate details.
    template: endorctl agent api --agent-id <agent-id> list -r VersionUpgrade -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>"
      and spec.upgrade_info.worth_it==true' --count -o json
    fields:
      - count
    constraints:
      - Use only for evidence availability after resolving one project UUID and explicit namespace provenance.
      - Stop after recording the count; candidate ranking belongs to selection-plan.
  - profile_id: selection-plan
    id: version-upgrade-summary
    canonical_id: version-upgrade-summary
    resource: VersionUpgrade
    purpose: Select one server-ranked UIA candidate with compact fields before any detailed Finding expansion.
    template: endorctl agent api --agent-id <agent-id> list -r VersionUpgrade -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>"
      and spec.upgrade_info.worth_it==true and spec.upgrade_info.is_best==true' --sort-path spec.upgrade_info.score --sort-order descending --page-size 1 --field-mask "uuid,spec.name,spec.upgrade_info.is_best,spec.upgrade_info.score"
      -o json
    fields:
      - uuid
      - spec.name
      - spec.upgrade_info.is_best
      - spec.upgrade_info.score
    constraints:
      - Run before detailed Finding expansion for selection plans.
      - Let Endor rank `is_best` candidates by score and return only the first bounded summary.
      - Do not call a candidate safe without UIA/CIA evidence or data_gaps.
  - profile_id: selection-plan
    id: sca-selection-evidence
    canonical_id: sca-selection-evidence
    resource: VersionUpgrade
    purpose: Project decision-critical UIA/CIA and fixed-finding evidence for only the selected upgrade candidate.
    template: >-
      endorctl agent api --agent-id <agent-id> list -r VersionUpgrade -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>" and uuid=="<VERSION_UPGRADE_UUID>"' --page-size 1 --field-mask "uuid,spec.name,spec.upgrade_info.direct_dependency_package,spec.upgrade_info.from_version,spec.upgrade_info.to_version,spec.upgrade_info.upgrade_risk,spec.upgrade_info.is_best,spec.upgrade_info.worth_it,spec.upgrade_info.total_findings_fixed,spec.upgrade_info.total_findings_introduced,spec.upgrade_info.score_explanation,spec.upgrade_info.deps_added,spec.upgrade_info.deps_removed,spec.upgrade_info.conflicts,spec.upgrade_info.minor_conflicts,spec.upgrade_info.cia_status,spec.upgrade_info.cia_results,spec.upgrade_info.direct_dependency_manifest_files,spec.upgrade_info.vuln_finding_info.current_count,spec.upgrade_info.vuln_finding_info.fixed_findings,spec.upgrade_info.vuln_finding_info.severity" -o json | jq -c '.list.objects[0] as $r | $r.spec.upgrade_info as $u | {uuid:$r.uuid,name:$r.spec.name,package:$u.direct_dependency_package,from_version:$u.from_version,to_version:$u.to_version,upgrade_risk:$u.upgrade_risk,is_best:$u.is_best,worth_it:$u.worth_it,cia_status:$u.cia_status,cia_results:($u.cia_results // []),conflicts:($u.conflicts // 0),minor_conflicts:($u.minor_conflicts // 0),deps_added:($u.deps_added // 0),deps_removed:($u.deps_removed // 0),finding_instances_fixed:$u.total_findings_fixed,unique_advisories_fixed:(($u.vuln_finding_info.fixed_findings // [])|length),fixed_finding_uuids:([(($u.vuln_finding_info.severity // {})[]? | (.fixed_summary // {})[]? | .uuid)] | unique),fixed_findings:($u.vuln_finding_info.fixed_findings // []),findings_introduced:($u.total_findings_introduced // 0),manifests:($u.direct_dependency_manifest_files // []),score_explanation:$u.score_explanation}'
    fields:
      - uuid
      - spec.name
      - spec.upgrade_info.direct_dependency_package
      - spec.upgrade_info.from_version
      - spec.upgrade_info.to_version
      - spec.upgrade_info.upgrade_risk
      - spec.upgrade_info.is_best
      - spec.upgrade_info.worth_it
      - spec.upgrade_info.total_findings_fixed
      - spec.upgrade_info.total_findings_introduced
      - spec.upgrade_info.score_explanation
      - spec.upgrade_info.deps_added
      - spec.upgrade_info.deps_removed
      - spec.upgrade_info.conflicts
      - spec.upgrade_info.minor_conflicts
      - spec.upgrade_info.cia_status
      - spec.upgrade_info.cia_results
      - spec.upgrade_info.direct_dependency_manifest_files
      - spec.upgrade_info.vuln_finding_info.current_count
      - spec.upgrade_info.vuln_finding_info.fixed_findings
      - spec.upgrade_info.vuln_finding_info.severity
    constraints:
      - Use after candidate summary ranking.
      - Treat the jq projection as authoritative and copy its fixed-finding UUID arrays character-for-character.
      - If detail is unavailable, keep the result blocked or plan-only and record data_gaps.
  - profile_id: selection-plan
    id: selected-source-usage
    canonical_id: selected-source-usage
    resource: local-files
    purpose: Inspect only selected package usage for compatibility and validation planning.
    template: rg -n '<PACKAGE_NAME>|<IMPORT_OR_SYMBOL>' <SELECTED_MANIFEST_OR_SOURCE_DIR>
    fields:
      - file
      - line
      - symbol
      - selected_package
    constraints:
      - Run only after one package is selected.
      - Do not scan unrelated source trees when the profile only needs a gate result.
  - profile_id: selection-plan
    id: selected-findings-by-uuid
    canonical_id: selected-findings-by-uuid
    resource: Finding
    purpose: Reconcile only the exact Finding UUIDs supplied by selected VersionUpgrade/UIA detail in one bounded read.
    selection_condition: runtime.selected_finding_reconciliation_required
    template: endorctl agent api --agent-id <agent-id> list -r Finding -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>"
      and uuid in [<FINDING_UUIDS>]' --page-size 100 --field-mask "uuid,context.type,spec.project_uuid,spec.target_uuid,spec.target_dependency_package_name,spec.level,spec.finding_metadata.vulnerability.meta.name,spec.finding_metadata.vulnerability.spec.aliases,spec.finding_metadata.vulnerability.spec.summary" -o json
    fields:
      - uuid
      - context.type
      - spec.project_uuid
      - spec.target_uuid
      - spec.target_dependency_package_name
      - spec.level
      - spec.finding_metadata.vulnerability.meta.name
      - spec.finding_metadata.vulnerability.spec.aliases
      - spec.finding_metadata.vulnerability.spec.summary
    constraints:
      - Build FINDING_UUIDS only from the selected VersionUpgrade detail returned in the current run.
      - Copy every UUID byte-for-byte and require 24 lowercase hexadecimal characters.
      - Use one `uuid in [...]` request; never issue one Finding request per UUID.
      - Run only when VersionUpgrade fixed-finding evidence cannot support a requested advisory mapping or count reconciliation.
      - Do not rerun this compact exact batch merely to create an artifact; when artifact delivery is known to be required, capture the first invocation.
      - Keep the result bounded to 100 exact UUIDs and report truncation; add `--list-all` only when complete selected-candidate rows are explicitly required and the artifact-delivery contract is used.
