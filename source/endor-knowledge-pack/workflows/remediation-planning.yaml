agent_id: remediation-planning
title: Remediation Planning Evidence Contract
summary: Preview remediation options only from verified Endor findings and VersionUpgrade/UIA evidence; local project docs
  are context, not evidence.
task_profiles:
  - id: resolve-scope
    title: Resolve Scope
    summary: Prove namespace, repository, and Endor project identity before planning.
    when_to_use:
      - The user asks whether a repository can be planned against Endor evidence.
      - Project resolution is missing or ambiguous.
    minimal_evidence:
      - Repository identity from current workspace or explicit user input.
      - Namespace provenance and Project lookup attempt.
    stop_when:
      - '`project_resolution.status` is resolved, unresolved, ambiguous, or lookup_unavailable.'
      - Do not report SCA counts or options in this profile.
    output_focus:
      - Return `project_resolution`, `evidence_queries`, and `data_gaps` without remediation options.
    output_fields:
      - summary
      - project_resolution
      - evidence_queries
      - data_gaps
      - policy_context
      - policy_evaluations
  - id: evidence-check
    title: Evidence Check
    summary: Check whether verified Finding and VersionUpgrade/UIA evidence exists for planning.
    when_to_use:
      - The user asks why a plan cannot be trusted or whether remediation evidence exists.
      - The request is exploratory and does not require a selected option.
    minimal_evidence:
      - Resolved project and namespace.
      - One scoped Finding query and one scoped VersionUpgrade/UIA query, or data_gaps for each unavailable lane.
    stop_when:
      - Evidence availability is known and unproven local counts are rejected.
      - Do not estimate counts, risk, review time, or touched files from local docs.
    output_focus:
      - Return evidence availability, empty or verified `remediation_options`, and precise `data_gaps`.
    output_fields:
      - summary
      - project_resolution
      - evidence_queries
      - remediation_options
      - data_gaps
      - policy_context
      - policy_evaluations
  - id: selection-plan
    title: Selection Plan
    summary: Preview one or more verified remediation options without editing files.
    when_to_use:
      - The user asks for a remediation plan or ranked options.
      - The host needs a read-only planning gate.
    minimal_evidence:
      - Resolved project, one server-ranked VersionUpgrade/UIA candidate, and detailed UIA/CIA and manifest evidence for the selected option.
      - Selected Finding evidence only when the VersionUpgrade detail lacks a fact required by the requested output.
    stop_when:
      - Verified options are ranked, or missing evidence blocks selection.
      - Do not mutate files, create branches, or open change requests.
    output_focus:
      - Return `remediation_options`, optional `selected_remediation`, `evidence_queries`, and `data_gaps`.
    output_fields:
      - summary
      - project_resolution
      - evidence_queries
      - remediation_options
      - selected_remediation
      - data_gaps
      - policy_context
      - policy_evaluations
resources:
  - name: Project
    purpose: Resolve repository-scoped project identity and namespace provenance before any remediation option.
    fields:
      - uuid
      - meta.name
      - spec.git
  - name: Finding
    purpose: Identify project-scoped vulnerability findings and affected packages without fabricating counts.
    fields:
      - uuid
      - context.type
      - spec.project_uuid
      - spec.finding_categories
      - spec.target_uuid
      - spec.dependency_file_paths
  - name: VersionUpgrade
    purpose: Read UIA/CIA remediation candidates, risk, fixed findings, introduced findings, and manifest targets.
    fields:
      - uuid
      - spec.upgrade_info
retrieval_steps:
  - Resolve namespace and project with provenance before reporting any finding count, remediation count, or selected option.
  - Treat repository files, project docs, CLAUDE.md, README content, and local paths as unverified context until Endor evidence
    or user-provided evidence confirms them.
  - For selection plans, query VersionUpgrade/UIA summaries before detailed Finding expansion; use narrow Finding availability
    or detail only when the profile requires it.
fallbacks:
  - If project resolution is missing, return `project_resolution.status` as `unresolved` and stop at data_gaps.
  - If Finding or VersionUpgrade evidence is unavailable, return plan-only insufficient evidence and do not estimate counts,
    risk, review time, or touched files.
data_gaps:
  - Record missing namespace, project resolution, Finding evidence, VersionUpgrade/UIA evidence, source-provider metadata,
    and host command capability in `data_gaps`.
  - Preserve `project_resolution.status`, `namespace_provenance`, query attempts, and context scope in the final output.
evidence_query_plans:
  - profile_id: resolve-scope
    title: Resolve Scope Query Plan
    objective: Resolve the repository to a namespace-scoped Endor project and stop before remediation evidence.
    query_order:
      - Read current repository identity or user-provided selectors.
      - Resolve namespace provenance from the current request, environment, or default config key extraction.
      - Query Project with a tight field mask and record attempted selectors.
    avoid:
      - Do not query Finding, VersionUpgrade, package, or dependency evidence before project scope is proven.
    stop_after:
      - Stop after project_resolution.status is resolved, ambiguous, unresolved, or lookup_unavailable.
    data_gaps:
      - Record missing namespace, unresolved project selectors, and host-blocked Endor reads in data_gaps.
  - profile_id: evidence-check
    title: Planner Evidence Query Plan
    objective: Verify remediation evidence availability without choosing a preferred option.
    query_order:
      - Resolve namespace and project first.
      - Query scoped VersionUpgrade/UIA summaries for candidate availability, risk, CIA, and manifest fields.
      - Query narrow main-context Finding availability only to confirm finding-backed remediation evidence.
    avoid:
      - Do not trust local docs, repository paths, or remembered counts as remediation_options.
      - Do not inspect source usage or draft a PR plan unless selection is requested.
    stop_after:
      - Stop after remediation evidence lanes are proven available or unavailable.
    data_gaps:
      - Record missing Finding evidence, missing VersionUpgrade/UIA evidence, unresolved project scope, and unavailable host
        tools in data_gaps.
  - profile_id: selection-plan
    title: Planner Selection Query Plan
    objective: Preview verified remediation options by ranking VersionUpgrade/UIA before Finding detail expansion.
    query_order:
      - Resolve Project, read one server-ranked VersionUpgrade summary, then fetch selected detail.
      - Stop when selected detail supports the requested risk, CIA, finding, and manifest claims.
      - >-
        Expand only for a named evidence gap: parent traversal, missing selected Finding evidence, comparable candidates, an
        explicit exhaustive request, or proven freshness uncertainty.
      - Read exact selected-package Findings only when VersionUpgrade detail cannot support requested explanation, advisory mapping,
        or reconciliation.
    avoid:
      - Do not enumerate broad Finding inventories as the default way to discover options.
      - Do not select remediation from local SCA counts, README claims, or cached notes.
      - Do not add Repository, ScanResult, alternative-candidate, or repeated cross-check reads without naming the gap they close.
    stop_after:
      - Stop after selected_remediation is null or backed by verified remediation_options and precise data_gaps.
    data_gaps:
      - Record skipped Finding detail, missing UIA/CIA fields, unverified counts, and unavailable project evidence in data_gaps.
evidence_query_recipes:
  - id: project-by-git
    canonical_id: project-by-git
    resource: Project
    purpose: Resolve the current repository to a namespace-scoped Endor project with only identity fields.
    template: endorctl agent api --agent-id <agent-id> list -r Project -n <namespace> --filter 'spec.git.full_name=="<owner/repo>"' --page-size 2 --field-mask "uuid,meta.name,meta.parent_uuid,spec.git" -o json
    fields:
      - uuid
      - meta.name
      - meta.parent_uuid
      - spec.git
    constraints:
      - Use the namespace selected by the preflight.
      - Retry with --traverse only for the same proven namespace before reporting data_gaps.
    profile_id: resolve-scope
  - profile_id: evidence-check
    id: finding-availability
    canonical_id: sca-finding-availability
    resource: Finding
    purpose: Check scoped vulnerability Finding availability without fetching full finding bodies.
    template: endorctl agent api --agent-id <agent-id> list -r Finding -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>"
      and spec.finding_categories contains FINDING_CATEGORY_VULNERABILITY and spec.dismiss==false' --field-mask "uuid,context.type,spec.project_uuid,spec.target_dependency_package_name,spec.level"
      -o json
    fields:
      - uuid
      - context.type
      - spec.project_uuid
      - spec.target_dependency_package_name
      - spec.level
    constraints:
      - Use for availability or selected-candidate reconciliation only.
      - Do not add --list-all for selection-plan discovery before VersionUpgrade narrowing.
  - profile_id: evidence-check
    id: version-upgrade-summary
    canonical_id: version-upgrade-summary
    resource: VersionUpgrade
    purpose: Select one server-ranked UIA candidate with compact fields before any detailed Finding expansion.
    template: endorctl agent api --agent-id <agent-id> list -r VersionUpgrade -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>"
      and spec.upgrade_info.worth_it==true and spec.upgrade_info.is_best==true' --sort-path spec.upgrade_info.score --sort-order descending --page-size 1 --field-mask "uuid,spec.name,spec.upgrade_info.is_best,spec.upgrade_info.score"
      -o json
    fields:
      - uuid
      - spec.name
      - spec.upgrade_info.is_best
      - spec.upgrade_info.score
    constraints:
      - Run before detailed Finding expansion for selection plans.
      - Let Endor rank `is_best` candidates by score and return only the first bounded summary.
      - Do not call a candidate safe without UIA/CIA evidence or data_gaps.
  - profile_id: selection-plan
    id: version-upgrade-summary
    canonical_id: version-upgrade-summary
    resource: VersionUpgrade
    purpose: Select one server-ranked UIA candidate with compact fields before any detailed Finding expansion.
    template: endorctl agent api --agent-id <agent-id> list -r VersionUpgrade -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>"
      and spec.upgrade_info.worth_it==true and spec.upgrade_info.is_best==true' --sort-path spec.upgrade_info.score --sort-order descending --page-size 1 --field-mask "uuid,spec.name,spec.upgrade_info.is_best,spec.upgrade_info.score"
      -o json
    fields:
      - uuid
      - spec.name
      - spec.upgrade_info.is_best
      - spec.upgrade_info.score
    constraints:
      - Run before detailed Finding expansion for selection plans.
      - Let Endor rank `is_best` candidates by score and return only the first bounded summary.
      - Do not call a candidate safe without UIA/CIA evidence or data_gaps.
  - profile_id: selection-plan
    id: version-upgrade-detail
    canonical_id: version-upgrade-detail
    resource: VersionUpgrade
    purpose: Fetch detailed UIA/CIA evidence for only the selected upgrade candidate.
    template: endorctl agent api --agent-id <agent-id> list -r VersionUpgrade -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>"
      and uuid=="<VERSION_UPGRADE_UUID>"' --page-size 1 --field-mask "uuid,spec.name,spec.upgrade_info" -o
      json
    fields:
      - uuid
      - spec.name
      - spec.upgrade_info
    constraints:
      - Use after candidate summary ranking.
      - If detail is unavailable, keep the result blocked or plan-only and record data_gaps.
  - profile_id: selection-plan
    id: selected-finding-detail
    canonical_id: selected-findings-by-package-version
    resource: Finding
    purpose: Fetch selected Finding evidence only when VersionUpgrade detail lacks facts required by the requested output.
    template: endorctl agent api --agent-id <agent-id> list -r Finding -n <namespace> --filter 'context.type==CONTEXT_TYPE_MAIN and spec.project_uuid=="<PROJECT_UUID>"
      and spec.target_uuid=="<FROM_PACKAGE_VERSION_UUID>" and spec.finding_categories contains FINDING_CATEGORY_VULNERABILITY
      and spec.dismiss==false' --page-size 25 --field-mask "uuid,context.type,spec.project_uuid,spec.target_uuid,spec.target_dependency_package_name,spec.level,spec.finding_metadata"
      -o json
    fields:
      - uuid
      - context.type
      - spec.project_uuid
      - spec.target_uuid
      - spec.target_dependency_package_name
      - spec.level
      - spec.finding_metadata
    constraints:
      - Use only after selected VersionUpgrade detail and only for a named missing fact.
      - Preserve the exact package-version UUID from VersionUpgrade; do not broaden to all project findings.
      - Keep the result bounded and report truncation instead of adding --list-all by default.
