apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: endor-auri-vm-installer
spec:
  info:
    title: Endor AURI for Developers (VM installer)
    version: "1.0.0"
    actuationTool:
      flavor: Terraform
      version: ">= 1.5.7"
    softwareGroups:
      - type: SG_OS
        software:
          - title: Debian
            version: "12"
      - software:
          - title: name
            version: "Endor AURI for Developers"
  content: {}
  interfaces:
    variables:
      - name: project_id
        description: The customer project ID to deploy into.
        varType: string
        required: true
      - name: goog_cm_deployment_name
        description: Deployment name (used to name the VM, service accounts, and Cloud Run service).
        varType: string
        required: true
      - name: region
        description: Region for the Cloud Run service and VM.
        varType: string
        defaultValue: us-central1
      - name: container_image
        description: The published Endor AURI for Developers container image (immutable @sha256 digest).
        varType: string
        defaultValue: us-central1-docker.pkg.dev/marketplace-458521/endor-agents/oss-a2ui@sha256:a716862321e85038d2187772410789eb677acfd98f162a7c934c9581c22c5bd1
      - name: ge_engine_id
        description: Gemini Enterprise engine resource path to auto-register into. Leave empty to register manually.
        varType: string
        defaultValue: ""
      - name: agent_display_name
        description: Display name for the agent in Gemini Enterprise.
        varType: string
        defaultValue: Endor AURI for Developers
      - name: endor_api_key_secret_id
        description: Secret Manager secret ID for the Endor API key (created by this bundle).
        varType: string
        defaultValue: endor-oss-api-key
      - name: endor_api_secret_secret_id
        description: Secret Manager secret ID for the Endor API secret (created by this bundle).
        varType: string
        defaultValue: endor-oss-api-secret
      - name: oss_router
        description: "Question router: 'rule' or 'model'."
        varType: string
        defaultValue: rule
      - name: endor_api_base_url
        description: Endor API base URL.
        varType: string
        defaultValue: https://api.endorlabs.com
      - name: machine_type
        description: Machine type for the installer VM.
        varType: string
        defaultValue: e2-small
      - name: zone
        description: Zone for the installer VM.
        varType: string
        defaultValue: us-central1-a
      - name: boot_disk_size
        description: Boot disk size (GB).
        varType: integer
        defaultValue: 20
      - name: boot_disk_type
        description: Boot disk type.
        varType: string
        defaultValue: pd-balanced
      - name: source_image
        description: Boot image for the installer VM (Marketplace-licensed VM image).
        varType: string
        defaultValue: projects/marketplace-458521/global/images/endor-auri-vm-licensed-v2
      - name: networks
        description: Network(s) to attach the VM to.
        varType: list(string)
        defaultValue:
          - default
    outputs:
      - name: cloud_run_service_name
        description: Name of the Cloud Run service the installer creates.
      - name: installer_vm
        description: The bootstrap VM that deploys + registers the agent.
      - name: installer_log_hint
        description: Command to watch the install log.
