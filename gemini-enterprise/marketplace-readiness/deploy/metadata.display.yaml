apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: endor-auri-agent-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  ui:
    input:
      variables:
        project_id:
          name: project_id
          title: Project ID
          invisible: true
        goog_cm_deployment_name:
          name: goog_cm_deployment_name
          title: Goog Cm Deployment Name
          invisible: true
        container_image:
          name: container_image
          title: Agent container image
          invisible: true
        region:
          name: region
          title: Region
          tooltip: The Google Cloud region to deploy the Cloud Run agent to.
          xGoogleProperty:
            type: ET_GCE_REGION
        endor_api_key_secret_id:
          name: endor_api_key_secret_id
          title: Endor API key secret
          tooltip: Name of the Secret Manager secret (in this project) that holds your Endor Labs API key.
        endor_api_secret_secret_id:
          name: endor_api_secret_secret_id
          title: Endor API secret secret
          tooltip: Name of the Secret Manager secret (in this project) that holds your Endor Labs API secret.
        endor_api_base_url:
          name: endor_api_base_url
          title: Endor API base URL
          tooltip: Leave the default unless Endor Labs directed you to a different endpoint.
        oss_router:
          name: oss_router
          title: Router
          tooltip: "'rule' is deterministic (no model key). 'model' uses Gemini tool-calling."
        machine_type:
          name: machine_type
          title: Placeholder VM machine type
          tooltip: The agent runs on Cloud Run, not on a VM. This small instance exists only to satisfy the Marketplace VM-listing requirement.
