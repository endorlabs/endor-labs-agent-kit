apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: endor-auri-agent-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  ui:
    input:
      variables:
        project_id:
          name: project_id
          title: Project ID
          invisible: true
        goog_cm_deployment_name:
          name: goog_cm_deployment_name
          title: Goog Cm Deployment Name
          invisible: true
        agent_package_name:
          name: agent_package_name
          title: Agent Package Name
          invisible: true
        agent_engine_name:
          name: agent_engine_name
          title: Agent name
          tooltip: The name of your Endor AURI Agent application in Vertex AI Agent Engine.
        region:
          name: region
          title: Region
          tooltip: The Google Cloud region to deploy the agent to.
          xGoogleProperty:
            type: ET_GCE_REGION
        endor_api_key_secret_id:
          name: endor_api_key_secret_id
          title: Endor API key secret
          tooltip: Name of the Secret Manager secret (in this project) that holds your Endor Labs API key.
        endor_api_secret_secret_id:
          name: endor_api_secret_secret_id
          title: Endor API secret secret
          tooltip: Name of the Secret Manager secret (in this project) that holds your Endor Labs API secret.
        endor_api_base_url:
          name: endor_api_base_url
          title: Endor API base URL
          tooltip: Leave the default unless Endor Labs directed you to a different endpoint.
        oss_router:
          name: oss_router
          title: Router
          tooltip: "'model' uses Gemini tool-calling (recommended). 'rule' is deterministic and needs no model."
        machine_type:
          name: machine_type
          title: Placeholder VM machine type
          tooltip: The agent runs on Agent Engine, not on a VM. This small instance exists only to satisfy the Marketplace VM-listing requirement; the default is sufficient.
