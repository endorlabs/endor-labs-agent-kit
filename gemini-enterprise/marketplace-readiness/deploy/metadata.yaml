apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: endor-auri-agent
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Endor AURI for Developers Deployer
    version: "1.0.0"
    actuationTool:
      flavor: Terraform
      version: ">= 1.5.7"
    description: {}
    softwareGroups:
      - type: SG_OS
        software:
          - title: Endor AURI for Developers
            version: "1.0.0"
  content: {}
  interfaces:
    variables:
      - name: project_id
        description: The customer project ID in which to deploy the Endor AURI for Developers.
        varType: string
        required: true
      - name: goog_cm_deployment_name
        description: The name of the deployment.
        varType: string
        required: true
      - name: region
        description: The GCP region for the Cloud Run service.
        varType: string
        defaultValue: us-central1
      - name: container_image
        description: The published Endor AURI for Developers container image.
        varType: string
        defaultValue: us-central1-docker.pkg.dev/endor-labs-marketplace-public/endor-agents/oss-a2ui:v1
      - name: endor_api_key_secret_id
        description: Secret Manager secret ID (in this project) holding the Endor API key.
        varType: string
        required: true
      - name: endor_api_secret_secret_id
        description: Secret Manager secret ID (in this project) holding the Endor API secret.
        varType: string
        required: true
      - name: endor_api_base_url
        description: Endor API base URL.
        varType: string
        defaultValue: https://api.endorlabs.com
      - name: oss_router
        description: Question router - 'rule' (deterministic) or 'model' (Gemini tool-calling).
        varType: string
        defaultValue: rule
      - name: machine_type
        description: Machine type for the placeholder compute instance (the agent runs on Cloud Run, not here).
        varType: string
        defaultValue: e2-standard-2
    outputs:
      - name: agent_url
        description: The Cloud Run URL of the deployed Endor AURI for Developers.
      - name: agent_card_url
        description: The A2A agent card URL to register in Gemini Enterprise.
      - name: region
        description: The region the agent was deployed to.
