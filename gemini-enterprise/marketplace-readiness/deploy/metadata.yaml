apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: endor-auri-agent
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Endor AURI Agent Deployer
    version: "1.0.0"
    actuationTool:
      flavor: Terraform
      version: ">= 1.5.7"
    description: {}
    softwareGroups:
      - type: SG_OS
        software:
          - title: Endor AURI Agent
            version: "1.0.0"
  content: {}
  interfaces:
    variables:
      - name: project_id
        description: The customer project ID in which to deploy the Endor AURI Agent.
        varType: string
        required: true
      - name: goog_cm_deployment_name
        description: The name of the deployment.
        varType: string
        required: true
      - name: agent_engine_name
        description: The name of the Agent Engine application.
        varType: string
        defaultValue: endor-auri-agent
      - name: region
        description: The GCP region to deploy to.
        varType: string
        defaultValue: us-central1
      - name: agent_package_name
        description: The name of the Python package inside the source archive.
        varType: string
        defaultValue: endor_oss
      - name: endor_api_key_secret_id
        description: Secret Manager secret ID (in this project) holding the Endor API key.
        varType: string
        required: true
      - name: endor_api_secret_secret_id
        description: Secret Manager secret ID (in this project) holding the Endor API secret.
        varType: string
        required: true
      - name: endor_api_base_url
        description: Endor API base URL.
        varType: string
        defaultValue: https://api.endorlabs.com
      - name: oss_router
        description: Question router - 'model' (Gemini tool-calling) or 'rule' (deterministic).
        varType: string
        defaultValue: model
      - name: machine_type
        description: Machine type for the placeholder compute instance (the agent runs on Agent Engine, not here).
        varType: string
        defaultValue: e2-standard-2
    outputs:
      - name: agent_engine_id
        description: The resource ID of the deployed Endor AURI Agent.
      - name: agent_name
        description: The name of the deployed agent.
      - name: region
        description: The region the agent was deployed to.
