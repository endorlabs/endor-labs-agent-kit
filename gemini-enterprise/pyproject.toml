[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endor-gemini-enterprise-agent"
version = "1.0.0"
description = "Endor Labs SCA Remediation A2A agent for Gemini Enterprise Marketplace (v1, read-only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Endor Labs" }]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
