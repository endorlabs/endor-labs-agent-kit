name: Gemini Enterprise CI

# Scoped to the hand-written gemini-enterprise/ service. This is deliberately
# separate from the recipe-publish pipeline (agent-kit-ci / publish-ai-plugins):
# gemini-enterprise/ is a continuously-deployed A2A service, not a generated
# recipe artifact, so it builds and tests on its own.
#
# NOTE: GitHub only executes workflows that live in the repository-root
# .github/workflows/. The design doc sketches this file under
# gemini-enterprise/.github/workflows/, but a workflow there would be ignored,
# so it lives here and is path-filtered to gemini-enterprise/** instead.

on:
  push:
    branches:
      - main
    paths:
      - "gemini-enterprise/**"
      - ".github/workflows/gemini-enterprise-ci.yml"
  pull_request:
    paths:
      - "gemini-enterprise/**"
      - ".github/workflows/gemini-enterprise-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: gemini-enterprise

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: |
          . .venv/bin/activate
          python -m pytest -q
